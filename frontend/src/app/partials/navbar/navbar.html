<mat-toolbar class="navbar">

  <!-- 1. IZQUIERDA: Logo y Menú -->
  <div class="nav-section nav-left">
    @if (isPrivate) {
      <button mat-icon-button class="menu-btn" (click)="onToggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>
    }
    <a type="button" (click)="goToInicio()" class="brand-logo-link">
  <!-- Apuntamos a la imagen original del búho, sin tocar el HTML del sidebar -->
  <img src="assets/images/logo-blanco.png" alt="Logo CampusForum" class="brand-logo" />
  </a>
    <a [routerLink]="isPrivate ? '/dashboard' : '/landing'" class="brand-text">
      <span class="brand-campus">CAMPUS</span>
      <span class="brand-forum">FORUM</span>
    </a>
  </div>

  <!-- 2. CENTRO: Enlaces de navegación -->
  <div class="nav-section nav-center">
    @if (isPublic) {
      <a mat-button (click)="goToInicio()">Inicio</a>
      <button mat-button (click)="goToProposito()">Propósito</button>
    }
    @if (isPrivate) {
      <button mat-button routerLink="/dashboard"><mat-icon>dashboard</mat-icon> Dashboard</button>
      <button mat-button routerLink="/posts"><mat-icon>article</mat-icon> Publicaciones</button>
      <button mat-button routerLink="/categories"><mat-icon>category</mat-icon> Categorías</button>
      <button mat-button routerLink="/reports"><mat-icon>report</mat-icon> Reportes</button>
    }
  </div>

  <!-- 3. DERECHA: Botones de Acción -->
  <div class="nav-section nav-right">
    @if (isPublic) {
      <button mat-button (click)="goToLogin()" class="login-btn">
        <i class="bi bi-box-arrow-in-right"></i><span>Login</span>
      </button>
      <button mat-raised-button (click)="goToRegistro()" class="register-btn">
        <i class="bi bi-person-plus"></i><span>Registro</span>
      </button>
    }
    @if (isPrivate) {
      <button mat-button class="navbar-profile-btn" (click)="goToProfile()">
        <mat-icon>person_outlined</mat-icon><span>Perfil</span>
      </button>
      <button mat-stroked-button class="logout-btn" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i><span class="logout-btn__text">Cerrar sesión</span>
      </button>
    }
  </div>

</mat-toolbar>
