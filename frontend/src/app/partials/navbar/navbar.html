<mat-toolbar class="navbar"
  ><div class="navbar__inner">
    <div class="brand-container">
      @if (isPrivate) {
        <button mat-icon-button type="button" (click)="onToggleSidebar()" aria-label="Abrir menú">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <a
        [routerLink]="isPrivate ? '/dashboard' : '/landing'"
        class="brand-text"
        aria-label="CampusForum, inicio"
        ><span class="brand-mark" aria-hidden="true">c<span>f</span></span
        ><span
          >Campus<span class="brand-forum">Forum</span><small>IDEAS QUE NOS CONECTAN</small></span
        ></a
      >
    </div>
    <nav class="navbar__links" aria-label="Navegación principal">
      <a mat-stroked-button class="nav-explore" routerLink="/posts"><i class="bi bi-compass" aria-hidden="true"></i> Explorar artículos</a>
      @if (isPublic) {
        <button mat-button type="button" (click)="goToProposito()">La comunidad</button>
      }
    </nav>
    <div class="navbar__actions">
      @if (isPublic) {
        <button mat-button type="button" (click)="goToLogin()">Iniciar sesión</button
        ><button mat-flat-button type="button" (click)="goToRegistro()">
          Crear cuenta <span aria-hidden="true">↗</span>
        </button>
      } @else {
        <button mat-button type="button" (click)="goToProfile()">
          <mat-icon>person_outline</mat-icon>Perfil</button
        ><button mat-stroked-button type="button" (click)="logout()" aria-label="Cerrar sesión">
          <mat-icon>logout</mat-icon><span class="logout-label">Salir</span>
        </button>
      }
    </div>
  </div></mat-toolbar
>
